apiVersion: v1
kind: Service
metadata:
  name: {{ include "game-gameinterface-cp.fullname" . }}
  labels:
    {{- include "game-gameinterface-cp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.service.grpc.port }}
      targetPort: {{ .Values.service.grpc.targetPort }}
      protocol: TCP
      name: grpc
  selector:
    {{- include "game-gameinterface-cp.selectorLabels" . | nindent 4 }}
