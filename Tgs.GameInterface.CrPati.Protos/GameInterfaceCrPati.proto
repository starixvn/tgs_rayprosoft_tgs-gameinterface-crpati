syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.CrPati.Protos";

package GameInterfaceCrPati;

// The greeting service definition.
service GameInterfaceCrPati {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameWager (GameWagerRequest) returns (GameWagerReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest{
	string api_url = 1;
	string api_key = 2;
	string api_secret = 3;
	string player_code = 4;
	string ip_address = 5;
}
message PlayerBalanceRequest {
	string api_url = 1;
	string api_key = 2;
	string api_secret = 3;
	string player_code = 4;
	string ip_address = 5;
}

message FundRequest {
	string api_url = 1;
	string api_key = 2;
	string api_secret = 3;
	string player_code = 4;
	string ip_address = 5;
	string order_id = 6;
	phoenix.protobuf.DecimalValue amount = 7;
}

message FundStatusRequest {
	string api_url = 1;
	string api_key = 2;
	string api_secret = 3;
	string player_code = 4;
	string ip_address = 5;
	string order_id = 6;
}

message GameUrlRequest {
	string api_url = 1;
	string api_key = 2;
	string api_secret = 3;
	string player_code = 4;
	string ip_address = 5;
	int32 lang = 6;
	bool is_mobile = 7;
}

message GameWagerRequest {
	string api_url = 1;
	string api_key = 2;
	string api_secret = 3;
	google.protobuf.Timestamp start_time = 4;
	google.protobuf.Timestamp end_time = 5;
	int32 page_number = 6;
	int32 page_size = 7;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string api_order_no = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	string resp = 3;
}

message GameUrlReply{
	bool is_player_exist = 1;
	string game_url = 2;
}

message GameWagerReply {
	repeated GameWagerInfo items = 1;
}

message GameWagerInfo {
	string external_wager_id = 1;
    string player_code = 2;
	bool is_closed = 3;
	bool is_void = 4;
	bool is_cancel = 5;
	bool Is_cashout = 6;
	google.protobuf.Timestamp external_created_on = 7;
	google.protobuf.Timestamp external_closed_on = 8;
	phoenix.protobuf.DecimalValue bet = 9;
	phoenix.protobuf.DecimalValue valid_bet = 10;
	phoenix.protobuf.DecimalValue settle = 11;
	phoenix.protobuf.DecimalValue win_loss = 12;
	string additional_data = 13;
}

message CheckingServiceReply{
    string machine_name = 1;
}